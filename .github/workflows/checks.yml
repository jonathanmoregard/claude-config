# Runs the repository's quick deterministic checks on every change.
#
# `pull_request` only, never `pull_request_target`: this repository's own
# branches are not forks and do get secrets, and GitHub Security Lab names
# "write their payload as a new test that will be run with others" as the
# matching attack. So the job takes no secrets, declares read-only
# permissions, and never fetches the vendored submodules.
#
# This is the enforcement point on purpose. A client-side git hook is not one:
# `git push --no-verify` skips it, and `core.hooksPath` is local config any
# worktree can change. Making `checks` a required status check on master is a
# repository setting, and the only step here that is not in the diff.
#
# WHAT THIS JOB RUNS, and why it is not a list. For a long time this job ran
# `tests/enforced/` and two named scripts, while the rest of the corpus -- 51
# top-level `tests/*.py`, 43 more in subdirectories, 23 shell suites -- ran
# nowhere at all. The cost of that was measured before this file was widened:
# on master, the unrun corpus stood at 905 passing, 254 FAILING and 15
# collection errors, nearly all of it one root cause. The `runtime/` cutover
# moved `hooks/`, `scripts/`, `skills/` and `settings.json` one level down, the
# tests kept building paths from the repository root, and nothing anywhere
# noticed for however many commits, because no gate read those files. A suite
# CI does not run is not a guard; it is a file that resembles one.
#
# So every step below discovers its own work. The three exclusions that remain
# are named, with their reason, because a suite that cannot run here must be
# visibly excluded rather than quietly skipped.
name: checks

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  # Superseded pull-request runs are waste; a master run is the record of
  # whether master is clean, so it is never cancelled.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    runs-on: ubuntu-latest
    # Without a ceiling a hung step -- a test waiting on a lock, a scanner on a
    # pathological file -- burns up to GitHub's six-hour default before anyone
    # finds out, on a public repository's shared minutes.
    #
    # Sized from measured local runs, not a guess, and the spread is the point:
    # the pytest step is 344s on an idle machine and 832s on the same tree with
    # other work competing for the cores -- a factor of 2.4 from contention
    # alone, which is exactly what a shared runner serves up. The shell suites
    # and the four provisioning steps add a few minutes. So 40 is built on the
    # CONTENDED figure rather than the fast one, and still catches a true hang
    # well inside the hour.
    #
    # `SCRIPT_SUITE_TIMEOUT_S` in tests/conftest.py is 900s, deliberately
    # inside this ceiling, so one hung script suite is reported as a failed
    # test rather than as a killed job.
    timeout-minutes: 40
    steps:
      # Pinned to the commit, not the tag: `v4` is a moving ref that the
      # upstream owner can repoint at any time, and this job's verdict is
      # exactly what an attacker would want to control -- a compromised
      # checkout could hand the rest of the steps a tampered tree and let a
      # bad commit report green. Upstream is on v7 now; this deliberately does
      # not bump a major version, which is a change with its own behaviour
      # risk and belongs in its own diff.
      #
      # persist-credentials: false because the default leaves a credential for
      # GITHUB_TOKEN in `.git/config` for the life of the job, and the steps
      # below run several hundred test subprocesses, many of which shell out to
      # `git` inside throwaway repositories. The job needs the token for
      # nothing after the clone.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          # The default shallow clone has HEAD and nothing behind it, and the
          # agent-e2e harness stages a config by `git archive`-ing a revision:
          # test_resume_reuses_a_verdict_only_for_the_same_config points an arm
          # at HEAD~1 on purpose, to prove a moved arm is re-run rather than
          # resumed from the old verdict. At depth 1 that object is absent,
          # `rev-parse HEAD~1` reports "Needed a single revision", and the case
          # fails having never exercised what it names -- measured. Two is what
          # it needs; 0 would fetch the whole history for nothing.
          fetch-depth: 2

      # Stdlib only, and deliberately before any install step: nothing fetched
      # from a package index can change this step's verdict.
      # `runtime/scripts/`, not `scripts/`: the runtime subset moved one level
      # down. The lint now locates the declared-entrypoint files in either
      # place and refuses to report clean when it finds neither, because this
      # step previously kept passing against a tree it could no longer read.
      - name: No declared entrypoint names a dev-only tree
        run: python3 runtime/scripts/lint-runtime-entrypoints.py

      # `shfmt` is mvdan/sh's CLI, and the backcheck's shell parser. Without it
      # every `classify()` answers `unknown:shfmt-unavailable` -- correct, by
      # design, and indistinguishable from the suite being broken. The parser
      # is provisioned rather than the test degraded: a classifier that decides
      # sandbox policy is exactly the thing whose guard must not be allowed to
      # pass on a machine that cannot run it.
      #
      # `go install ...@version`, for the same reason the gitleaks step below
      # gives: the toolchain verifies it against the Go checksum database, so
      # this file does not grow a checksum someone has to remember to bump,
      # and the only thing to bump is the version. Its own step, and a version
      # print, so "the parser is absent" fails here and reads as itself
      # instead of as a hundred unrelated-looking assertion failures in the
      # step below. Not `shellcheck` -- a different project and a different
      # binary, which does not bring `shfmt` with it.
      #
      # Was Ubuntu's archive until 2026-11-11, when apt's mirrors went
      # unreachable for half an hour -- `Temporary failure resolving
      # 'archive.ubuntu.com'`, apt exit 100 -- failing this step on `master`
      # at 31912c7 and on three pushes to feat/artl-gate. Retrying was tried
      # first and was the wrong shape: a 15s/30s backoff cannot outlast a
      # 30-minute outage, and the retry still failed at 539e926. The module
      # proxy is a different network path from Ubuntu's mirrors and was up
      # throughout, so this removes the dependency rather than waiting on it.
      # The error names which half broke: a parser that could not be installed
      # is not a formatting failure, and reading it as one sent a reviewer
      # hunting a code regression that did not exist.
      - name: The shell parser the backcheck depends on is present
        run: |
          if ! go install mvdan.cc/sh/v3/cmd/shfmt@v3.12.0; then
            echo "::error::shfmt could not be provisioned (go install failed) -- the shell-format backcheck never ran, so this is NOT a formatting failure" >&2
            exit 1
          fi
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/shfmt" --version

      # `gitleaks` serves two steps below: the behavioural half of the
      # proposals-sink config test, and the whole-tree secret scan. A config
      # missing `[extend] useDefault = true` is a valid file that scans for
      # nothing, and the static TOML check cannot see the effect. Same
      # reasoning as `shfmt` above: the scanner is provisioned rather than the
      # test degraded, and the test fails, not skips, when it is absent -- a
      # secret-scanner guard must not pass on a machine that cannot run one.
      #
      # Not Ubuntu's archive, unlike `shfmt`: noble ships gitleaks 8.16.0,
      # which predates the `git`/`dir` subcommands and `useDefault` that the
      # pusher and this config rely on, so it would test a different scanner
      # than production runs. Not a pinned release tarball either: that needs
      # a checksum someone has to remember to bump. `go install ...@version`
      # is verified against the Go checksum database by the toolchain itself,
      # so the only thing to bump is the version, which should track the one
      # in nixos-config. Its own step, and a version print, for the same
      # reason as above.
      - name: The secret scanner the proposals-sink guard depends on is present
        run: |
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          "$(go env GOPATH)/bin/gitleaks" version

      # The third scanner with the same shape, and the same argument.
      # permission-ledger aggregates transcript-derived tool-call samples into
      # proposal files that a pusher later ships to GitHub, and
      # `run_secret_scan` in runtime/permission-ledger/aggregate.py is the
      # FIRST redaction gate on that path. Absent the binary it returns
      # "unavailable: detect-secrets not on PATH; samples emitted unscanned"
      # and every sample goes out unredacted, with every health signal clean.
      #
      # Pinned to the version the parsing was written against: aggregate.py
      # matches `: True` out of detect-secrets' per-detector output, a format
      # this pin is what keeps stable. pip, because detect-secrets is a Python
      # package and there is no apt or Go story for it.
      - name: The secret scanner the permission-ledger redaction depends on is present
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'detect-secrets==1.5.0'
          detect-secrets --version

      # The repository's own secrets gate, and until now it had none. The only
      # thing scanning this tree was the global pre-commit hook on one
      # developer machine -- which is precisely what the header of this file
      # argues is not an enforcement point, since `--no-verify` skips it and
      # `core.hooksPath` is local config. The scanner is already installed two
      # steps up, so this costs one command.
      #
      # `--redact` because this is a public repository and a finding must not
      # print the matched string into a world-readable log. `--exit-code 1` is
      # explicit rather than relying on the default.
      #
      # A fresh checkout here has no populated `vendor/` submodules (this job
      # never fetches them) and no `__pycache__`, so what this scans is this
      # repository's own tracked content. It runs BEFORE the test steps for
      # the obvious reason -- a leaked credential should fail fast -- but it
      # does not DEPEND on running first: `.gitleaks.toml` exempts compiled
      # bytecode precisely so that the verdict cannot depend on whether a test
      # run has written `.pyc` files yet.
      - name: No credential reaches the tree
        run: gitleaks dir . --config .gitleaks.toml --no-banner --redact --exit-code 1

      # The whole tree, never a list of files. A suite that guards one of this
      # repository's own guards is itself a measuring instrument, and an
      # instrument CI does not run is not protected by requiring this job --
      # which is exactly what an enumerated list produces, silently, the first
      # time someone adds a suite and forgets this file.
      #
      # This one command covers BOTH kinds of python suite in the tree. The
      # self-running scripts -- the ones whose checks execute at import time and
      # whose exit status is the verdict -- stop themselves under pytest with a
      # `script suite:` skip, and `tests/conftest.py` turns that marker back
      # into one real test that runs the file as a script in a subprocess. So
      # there is no second step here and no list of script files anywhere; see
      # the comment above `pytest_pycollect_makemodule` in that file.
      #
      # The `live suite:` gate is the counterpart: two modules drive a real paid
      # `claude -p` AT IMPORT TIME, so merely collecting them starts billable
      # calls. Gating them is the only way `pytest tests` can be safe to run at
      # all, here or on a laptop. Their proofs are not weakened -- run as
      # `python3 tests/<module>.py` every probe still fires -- but they now have
      # no automatic runner, and that is a real gap rather than a tidy
      # separation. `tests/smoke.sh` was the only thing that ever invoked them,
      # and its TEST 50 discovery greps `$WORKTREE/hooks`, a directory the
      # `runtime/` cutover emptied, so it hard-fails at discovery. Repairing
      # smoke.sh is its own job: 63 of its path references point into the old
      # layout, and no part of it can be verified without a paid run.
      #
      # What is NOT run, and why. These are exclusions of things that cannot run
      # here or are known-red, NOT an inclusion list. A suite added tomorrow is
      # picked up with no edit to this file, which is the property that matters.
      #
      # Single cases are held out with `--deselect` rather than `--ignore`
      # wherever the rest of the file passes: a file-level exclusion would have
      # taken 229 passing assertions out of the gate along with them, which is
      # how coverage quietly evaporates.
      #
      # Say plainly what kind of thing this list is. It IS a hand-maintained
      # list, the one thing the rest of this file argues against -- so the
      # distinction that matters is the failure mode. The stale list this change
      # replaced failed SILENTLY: a suite nobody ran reported nothing. This one
      # fails LOUDLY: add a dcg-dependent case to a class below and it goes red
      # here, because the exclusions name what exists today rather than
      # describing a category. Red is a signal; silence was not.
      #
      # GROUP 1 -- requires a host binary a GitHub runner cannot have.
      # These were measured, not assumed. The local gate for this change was
      # green only because this developer's machine carries `secret-redact`,
      # `agent-activity` and `dcg` in its user profile; a sweep under a PATH
      # holding exactly what the steps above provision found 52 failures that a
      # runner would have hit on every pull request. None of the three is
      # provisionable: unlike `shfmt`, `gitleaks` and `detect-secrets`, they are
      # nixos-config packages with no apt, pip or Go story, so the argument
      # those three steps make ("provision the tool rather than degrade the
      # test") has nowhere to land here.
      #
      #   test_tool_output_redact   `secret-redact`. Absent, the suite exits 1
      #   test_bash_guards           and in two of the three also dies on an
      #   test_bash_guard_post       uncaught traceback -- the guard reports
      #                              itself BROKEN, correctly, and the suite is
      #                              measuring a guard that cannot run.
      #                              test_bash_guard_post additionally resolves
      #                              a sibling hook through `agent-activity`.
      #   git-broker (12 entries)    `dcg`, for 37 cases: the broker refuses to
      #                              build a sandbox without its validator --
      #                              "BROKEN safety boundary", server.py:949 --
      #                              which is the right behaviour and leaves
      #                              nothing to test. The other 8 were first
      #                              held out as needing `bwrap`, which a runner
      #                              in fact has; what they really need is
      #                              /home/jonathan/worktrees, since every
      #                              black-box class builds its fixture there
      #                              with an explicit `dir=`. Either way they
      #                              cannot run here. Six whole classes plus six
      #                              single cases, so 103 of the file's 152 stay
      #                              enforced here. The better fix is for the
      #                              suite to resolve those two the way it
      #                              already resolves `git`
      #                              (`shutil.which(...) or ...`, line 1007) and
      #                              stubs the validator elsewhere; that is a
      #                              rework of argv assertions across 49
      #                              containment cases, not a path repair, so it
      #                              is a follow-up rather than part of this
      #                              change.
      #
      # GROUP 2 -- correctly reporting a real defect in shipped code or config.
      #
      # Of the five, FOUR are tests correctly reporting a real problem in
      # shipped code or config. They are held out because this change is not
      # authorized to alter that code, not because they are wrong. Fix the
      # underlying defect and the deselect line goes away:
      #
      #   fail_open_paths::...no_policy_or_state_override
      #     `runtime/mcp-servers.json` has no `egress-guard` entry, so the
      #     egress guard sits on disk unregistered. Removed by 658e7ce
      #     ("feat(scope): worktrees ... join the session automatically"), whose
      #     message does not mention it, hours after 314ee61 deliberately
      #     restored it, and no later commit retires it. The test is right.
      #   aggregator_recall...::a_probe_file_with_no_permissions...
      #     `runtime/hooks/aggregator-recall-health.py` cuts probe stderr to
      #     `[:200]`, and the reason sits at the TAIL, so on a long
      #     nix-store-plus-tmp path `[Errno 13] Permission denied` is truncated
      #     to `Perm`. Whether this passes depends on path length, which is no
      #     basis for a gate in either direction.
      #   harness_runtime_dirs_ignored::every_exclusion_is_ignored
      #     No `.gitignore` rule covers `remote-control` -- a genuine gap. But
      #     ~/.claude is no longer a git checkout at all, so whether this suite
      #     still guards anything live is itself the open question.
      #   git_broker::real_policy_reaches_claude_and_nixos_worktree_roots
      #     Asserts `/home/jonathan/.claude` is a `repositoryRoot`. It is not,
      #     deliberately: 5580ea9 is literally "drop the dead ~/.claude entries
      #     from the allowlists". The test also uses that path as its exemplar
      #     for protected-primary behaviour, so repairing it means choosing a
      #     new exemplar -- a security-semantics decision, not a path swap. The
      #     invariant itself is already covered by
      #     tests/enforced/test_git_broker_protects_config_checkout.py, which
      #     reasons about the cutover explicitly, so nothing is uncovered here.
      #   ai-router/test_jobs::quota_failure_writes_rejected_and_retries_once
      #     A time bomb, not a flake: the stub's quota reset time is now in the
      #     past, so the router correctly treats the bucket as reset. The runner
      #     subprocess reads `time.time()` directly, so fixing it needs either a
      #     clock override in production code or a relative-time stub fixture.
      #
      # GROUP 3 -- whole-file, for reasons that are not about a missing binary:
      #
      #   tests/agent-e2e          Scenarios dispatch REAL headless agents and
      #                            cost real money per run. It holds no
      #                            pytest-collectible file today, so this is
      #                            belt and braces against one arriving.
      #   test_arftl_gate_cascade  All nine cases fail: they extract a bash
      #                            cascade that 66dfae5 ("compact ARTL
      #                            close-out review") deleted from the skill
      #                            along with ~1300 other lines. Red since well
      #                            before the cutover, now guarding something
      #                            that does not exist. Pending a decision on
      #                            whether the cascade returns. NOT a path
      #                            repair.
      #
      # Nothing is excluded for flaking. One case did flake in this branch's own
      # gate -- permission-ledger/test_aggregate::...hung_scanner_is_killed...,
      # in the whole-corpus run that took 832s where an isolated run takes 2s --
      # and it was hardened rather than held out, because a suite excluded for
      # being flaky is a suite that stops reporting. It sampled a pid once at
      # the instant the call returned, which races the kernel's reaping of the
      # orphan; it now polls the condition. Hardening it also showed that the
      # liveness check could not observe the regression it exists for at all,
      # so the case now asserts the elapsed time, which is where that defect is
      # actually visible. See the commit for the measurements.
      - name: The guards still detect what they are for
        run: |
          python3 -m pip install --disable-pip-version-check --quiet 'pytest>=8,<9'
          GB=tests/mcps/git-broker/test_git_broker.py
          python3 -m pytest tests -q \
            --ignore=tests/agent-e2e \
            --ignore=tests/test_arftl_gate_cascade.py \
            --ignore=tests/test_tool_output_redact.py \
            --ignore=tests/test_bash_guards.py \
            --ignore=tests/test_bash_guard_post.py \
            --deselect "$GB::BlackBoxBrokerTests" \
            --deselect "$GB::BlackBoxParityTests" \
            --deselect "$GB::ContainmentArgvTests" \
            --deselect "$GB::IgnoredWorktreeRemovalTests" \
            --deselect "$GB::DestructiveOperationSafetyTests" \
            --deselect "$GB::CloneDispatchTests" \
            --deselect "$GB::ToolExecutionTests::test_branch_set_upstream_config_failure_exits_one" \
            --deselect "$GB::ToolExecutionTests::test_git_tool_validates_every_boundary_before_running" \
            --deselect "$GB::ToolExecutionTests::test_push_keeps_success_when_recording_upstream_fails" \
            --deselect "$GB::ToolExecutionTests::test_validator_refusal_prevents_sandbox_build_and_spawn" \
            --deselect "$GB::ParityOperationArgvTests::test_clone_sandbox_binds_only_the_new_target_writable" \
            --deselect "$GB::ParityOperationArgvTests::test_local_sequencer_runs_offline_with_editor_disabled" \
            --deselect "$GB::PolicySchemaTests::test_real_policy_reaches_claude_and_nixos_worktree_roots" \
            --deselect 'tests/test_fail_open_paths.py::test_registered_server_carries_no_policy_or_state_override' \
            --deselect 'tests/test_aggregator_recall_health_hook.py::test_a_probe_file_with_no_permissions_is_still_found_and_reported_on' \
            --deselect 'tests/test_harness_runtime_dirs_ignored.py::HarnessRuntimeIsIgnored::test_every_exclusion_is_ignored' \
            --deselect 'tests/ai-router/test_jobs.py::test_quota_failure_writes_rejected_and_retries_once'

      # Shell suites, by the naming convention already in the tree rather than
      # by a list. Shell has no collection phase and no skip mechanism, and
      # some scripts under `tests/` are emphatically not CI work: `smoke.sh`
      # spends real API money, `live.sh` needs a real API key,
      # `live-kitty*.sh` need a real terminal emulator,
      # `mount-geometry-probe.sh` needs the host's bind mounts.
      #
      # Those divide cleanly from the hermetic suites by name, and the tree
      # already observes it: a scenario harness is `test_*.sh` or `*.test.sh`,
      # while an opt-in live harness is `live*.sh`, `smoke.sh` or `*-probe.sh`.
      # Globbing the first two patterns therefore picks up exactly the suites
      # that run against throwaway repositories and temp dirs, and cannot pick
      # up a live one. Land a suite under either name and it is enforced from
      # that commit.
      #
      # Not `tests/enforced/*.sh`, which was the obvious move and is wrong:
      # every one of these resolves the repository root as `$0/..`, so
      # relocating them one directory deeper breaks all eight at once.
      #
      # This step previously ran ONE named script. The other seven -- 346
      # assertions between them, every one against throwaway repositories --
      # ran nowhere, and five of the seven were broken by the `runtime/`
      # cutover with nobody to notice. `test_mint_gh_token.sh` additionally
      # needs `openssl`, which the runner image provides; absent, it exits 2
      # with a clear message rather than passing vacuously.
      - name: The enforced shell suites still pass
        run: |
          shopt -s nullglob
          # The third pattern is one named exception to the depth rule.
          # `tests/advice-refine-test-loop/` holds three hermetic suites under a
          # third naming convention -- `*-test.sh` -- which the two patterns
          # above miss on the name AND on the depth, so all three ran nowhere.
          # That is how compact-skill-test.sh's orchestrate assertion stayed red
          # for two months, and deterministic-gate.sh still has no other CI
          # coverage at all.
          #
          # Named explicitly rather than made recursive: `tests/**/*.sh` would
          # collect the ~170 `setup.sh`/`check.sh` files under
          # `tests/agent-e2e/`, which are not suites. They read $E2E_WORK and
          # $E2E_RUN and take a run directory as $1, so running them bare does
          # something rather than reporting something. Depth stays load-bearing.
          suites=(tests/test_*.sh tests/*.test.sh tests/advice-refine-test-loop/*-test.sh)
          # Same refusal as the python partition: an empty glob must not read
          # as success. This is the exact failure the convention is meant to
          # remove, so it is checked rather than assumed.
          if [ ${#suites[@]} -eq 0 ]; then
            echo "no shell suites matched tests/test_*.sh, tests/*.test.sh or" \
                 "tests/advice-refine-test-loop/*-test.sh -- expected several;" \
                 "the glob or the layout changed" >&2
            exit 1
          fi
          rc=0
          for s in "${suites[@]}"; do
            echo "::group::$s"
            if bash "$s"; then echo "ok   $s"; else echo "FAIL $s"; rc=1; fi
            echo "::endgroup::"
          done
          exit $rc
