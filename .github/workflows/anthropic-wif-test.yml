# TEMPORARY. Proves the honeypot lane's credential path end to end before the
# lane depends on it, and is deleted in the commit that follows a green run.
#
# It answers four questions the docs do not:
#   1. which GitHub event the federation rule actually accepts. Answered: it
#      first ran on `push` as well, and the two subjects side by side showed
#      that GitHub issues this repository an IMMUTABLE subject --
#      `repo:owner@ownerid/repo@repoid:event` -- which the Console's wizard
#      does not build. The rule now pins the pull-request subject, so a push
#      would be refused on purpose and that trigger is gone;
#   2. whether the exchange succeeds at all, with the identity's own claims
#      printed next to it so a refusal reads as a mismatch rather than a 401;
#   3. whether the minted `sk-ant-oat01-...` token is accepted by the Messages
#      API as a plain bearer;
#   4. whether the Claude Code CLI accepts it through ANTHROPIC_AUTH_TOKEN,
#      which is what `honeypot.yml` does and is the one step no Anthropic doc
#      describes.
name: anthropic-wif-test

on:
  pull_request:
    branches: [master]

permissions:
  id-token: write
  contents: read

jobs:
  exchange:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RULE_ID: fdrl_016trP46a6Eh1CaVVTfxSsJ9
      ORG_ID: e3721c03-cb62-4878-a369-1877426f91f6
      SERVICE_ACCOUNT_ID: svac_01KYpZpWPCh679sJsWybkDbn
      WORKSPACE_ID: wrkspc_01Ccy4599SW8Km85QwD4ej6D
    steps:
      - name: Fetch the GitHub identity token
        uses: actions/github-script@v8
        with:
          script: |
            const token = await core.getIDToken('https://api.anthropic.com');
            core.setSecret(token);
            core.exportVariable('JWT', token);

      # The claims the rule is matched against. Not secret -- the signature is
      # what makes the token worth anything, and that is never printed.
      - name: What this run's identity claims to be
        shell: bash
        run: |
          echo "event: ${GITHUB_EVENT_NAME}"
          payload=${JWT#*.}
          payload=${payload%%.*}
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac
          printf '%s' "$payload" | tr '_-' '/+' | base64 -d \
            | jq '{sub, aud, repository, repository_owner, repository_owner_id,
                   event_name, ref}'

      - name: Exchange it for an Anthropic token
        shell: bash
        run: |
          jq -n --arg assertion "$JWT" --arg rule "$RULE_ID" --arg org "$ORG_ID" \
                --arg account "$SERVICE_ACCOUNT_ID" --arg workspace "$WORKSPACE_ID" \
            '{grant_type: "urn:ietf:params:oauth:grant-type:jwt-bearer",
              assertion: $assertion, federation_rule_id: $rule,
              organization_id: $org, service_account_id: $account,
              workspace_id: $workspace}' > "${RUNNER_TEMP}/body.json"
          code=$(curl --silent --show-error --output "${RUNNER_TEMP}/response.json" \
            --write-out '%{http_code}' https://api.anthropic.com/v1/oauth/token \
            -H 'content-type: application/json' --data "@${RUNNER_TEMP}/body.json")
          rm -f "${RUNNER_TEMP}/body.json"
          echo "HTTP ${code}"
          jq 'with_entries(if (.key | test("token$")) then .value = "<redacted>" else . end)' \
            "${RUNNER_TEMP}/response.json"
          token=$(jq -r '.access_token // empty' "${RUNNER_TEMP}/response.json")
          rm -f "${RUNNER_TEMP}/response.json"
          if [ -z "$token" ]; then
            echo "no access token; the reason is in the Console's Workload"
            echo "identity page under its history tab."
            exit 1
          fi
          echo "::add-mask::$token"
          printf '%s' "$token" > "${RUNNER_TEMP}/anthropic-token"
          chmod 600 "${RUNNER_TEMP}/anthropic-token"

      - name: The Messages API accepts it as a bearer
        shell: bash
        run: |
          jq -n '{model: "claude-haiku-5-5", max_tokens: 4,
                  messages: [{role: "user", content: "Reply with the single word ok."}]}' \
            > "${RUNNER_TEMP}/message.json"
          code=$(curl --silent --show-error --output "${RUNNER_TEMP}/reply.json" \
            --write-out '%{http_code}' https://api.anthropic.com/v1/messages \
            -H "authorization: Bearer $(cat "${RUNNER_TEMP}/anthropic-token")" \
            -H 'anthropic-version: 2023-06-01' \
            -H 'content-type: application/json' --data "@${RUNNER_TEMP}/message.json")
          echo "HTTP ${code}"
          jq '{type, model, stop_reason, text: (.content[0].text // .error.message)}' \
            "${RUNNER_TEMP}/reply.json"
          [ "$code" = "200" ]

      # The step that matters most: `honeypot.yml` hands the federated token to
      # the agent this way, and no Anthropic document says it works.
      - name: The Claude Code CLI accepts it through ANTHROPIC_AUTH_TOKEN
        shell: bash
        run: |
          npm install --global @anthropic-ai/claude-code
          claude --version
          ANTHROPIC_AUTH_TOKEN=$(cat "${RUNNER_TEMP}/anthropic-token")
          export ANTHROPIC_AUTH_TOKEN
          claude -p 'Reply with the single word ok.' --max-budget-usd 0.05
