# dcg configuration
# https://github.com/Dicklesworthstone/destructive_command_guard
#
# Tracked in ~/.claude/dcg.toml; symlinked to ~/.config/dcg/config.toml.

[general]
verbose = false

# Unattended sessions have no human to resolve an indeterminate result, so dcg's
# own failure behaviour stays strict. bash-guard.py already converts dcg faults
# and `ask` verdicts into a deny; this keeps dcg fail-closed when it is invoked
# directly or through a future integration (defence in depth).
# Verified: `dcg config` reports `Fail closed: true` with this key (dcg 0.12.5).
# PR #76 also set `unverified_decision = "deny"`: dcg 0.12.5 has no such key and
# ignores it silently, so it is deliberately not carried over.
fail_closed = true

# dcg's own evaluation deadline. Upstream default is 1000ms, and a command
# that misses it does NOT get evaluated: dcg renders `permissionDecision:
# "ask"` (src/hook.rs `write_indeterminate_to`), meaning "no verdict, a human
# decides". hooks/bash-guard.py blocks on that, correctly — but a block for
# "the box was busy" is a false refusal of legitimate work.
#
# Measured on this host 2026-09-04. Eight ordinary commands were refused that
# way in one morning while a runaway embedding service saturated the CPU: a
# heredoc'd python probe, a `for` loop, a `sleep`-then-`git log` poll. The
# same commands re-measured at 45-170ms once the box was idle, so the 1000ms
# budget was never close to binding on the WORK — only on the load.
#
# 2000ms is ~12x the slowest idle measurement, and it stays inside the
# guard's own ladder: bash-guard.py caps a dcg call at DCG_TIMEOUT_S=5 and
# arms its whole-hook watchdog at GUARD_DEADLINE_S=6, so the hook call plus
# the `dcg config` health check still fit with room left. Raising this much
# past 2000 would start trading dcg's deadline for the guard's, which turns a
# clear "dcg did not finish" into a broken-guard deny.
#
# Verified: `dcg config` reports `Hook timeout (ms): 2000 (configured)` with
# this key present (dcg 0.12.5 honours it with a floor and no ceiling —
# src/config.rs `effective_hook_timeout_ms`).
hook_timeout_ms = 2000

# DO NOT RE-ENABLE. Upstream defaults this to true, and true means dcg
# REWRITES ~/.claude/settings.json from inside the hook path.
#
# What it does (dcg 0.12.5): on every bare-`dcg` hook invocation — which is
# how hooks/bash-guard.py consults it, one per Bash tool call — main.rs:1534
# calls cli::ensure_hook_registered(). That reads $HOME/.claude/settings.json
# (cli.rs:13262, hardcoded; CLAUDE_CONFIG_DIR is NOT honoured) and looks for a
# PreToolUse entry with matcher "Bash|PowerShell" whose command is the absolute
# path of the running dcg binary (cli.rs:13614, :11263, :11368). We register
# dcg *indirectly*, through bash-guard.py, so that exact entry is never there
# and the check never passes. dcg then takes the repair branch (cli.rs:13635)
# and writes the file: it inserts its own hook entry at PreToolUse[0], AHEAD of
# our matcher-"*" guard entry (cli.rs:11707), and re-serialises the whole file
# with serde_json::to_string_pretty — reflowing our formatting and dropping the
# trailing newline.
#
# This is not hypothetical. It fired on the live file on 2026-08-24 16:50:40
# local: `git -C ~/.claude diff settings.json` showed the injected
# "Bash|PowerShell" entry pointing at the nix store path, and the tripwire
# logged FOUR ConfigChange/user_settings events at 14:50:41Z for that one
# write — the permission surface changing underfoot, once per live session.
#
# It is idempotent only until the path changes. The entry it writes embeds the
# absolute executable path, so every nixpkgs rebuild of dcg gives a new
# /nix/store/... hash, the match fails again, and it rewrites settings.json
# again. Reverting the entry by hand does not stick either — the next Bash tool
# call re-adds it.
#
# What is lost by disabling: dcg no longer re-registers ITS OWN direct
# PreToolUse hook if that entry disappears. We never had that entry, and do not
# want it — bash-guard.py is the registered hook and it invokes dcg itself,
# fail-closed, with its own health check on this config file. Nothing else
# depends on self-heal: evaluation, packs, and the deny verdict are unaffected
# (verified under an isolated HOME — a `rm -fr /` payload still returns the full
# permissionDecision":"deny" document with self_heal_hook = false).
self_heal_hook = false

[packs]
enabled = []
disabled = []

[overrides]
allow = []

# Block destructive HTTP methods via common CLI tools and Python clients.
# Bypass: run the command yourself with `! <command>` in the Claude Code
# prompt. Claude cannot bypass these blocks on your behalf.
# Note: custom [overrides] block patterns do not generate allow-once codes.
#
# Known gaps (DCG cannot catch these reliably):
#   - Variable-interpolated methods: METHOD=DELETE; curl -X $METHOD ...
#   - urllib.request.Request(url, method='DELETE')
#   - POST to delete-style endpoints (too many FPs to block POST generally)
#   - Aliased commands: alias del='curl -X DELETE'
block = [
    # ── ADB destructive operations ─────────────────────────────────────────
    { pattern = "adb\\s+uninstall", reason = "ADB uninstall blocked — do not remove apps from device. Run it yourself with `! <command>` if intentional." },
    { pattern = "adb\\s+shell\\s+pm\\s+uninstall", reason = "ADB pm uninstall blocked. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+pm\\s+clear", reason = "ADB pm clear blocked — wipes all app storage. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+rm", reason = "ADB shell rm blocked — do not delete files on device. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+reboot", reason = "ADB reboot blocked. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+wipe", reason = "ADB wipe blocked — extremely destructive. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+settings\\s+put", reason = "ADB system settings write blocked. Run it yourself if intentional." },
    { pattern = "adb\\s+shell\\s+am\\s+kill\\b", reason = "ADB am kill blocked — use force-stop com.jhana.app instead. Run it yourself if intentional." },

    # ── DELETE / PUT / PATCH — always destructive ─────────────────────────
    # curl: short flag (-X) and long flag (--request)
    { pattern = "curl.*-X\\s+(DELETE|PUT|PATCH)", reason = "Destructive HTTP method — deletes or overwrites a remote resource. Run it yourself with `! <command>` if intentional." },
    { pattern = "curl.*--request\\s+(DELETE|PUT|PATCH)", reason = "Destructive HTTP method — deletes or overwrites a remote resource. Run it yourself with `! <command>` if intentional." },

    # wget
    { pattern = "wget.*--method[=\\s](DELETE|PUT|PATCH)", reason = "Destructive HTTP method via wget — modifies or deletes a remote resource. Run it yourself with `! <command>` if intentional." },

    # httpie CLI: `http DELETE url`, `http PUT url`, `http PATCH url`
    { pattern = "\\bhttp\\s+(DELETE|PUT|PATCH)\\s", reason = "httpie destructive HTTP method — modifies or deletes a remote resource. Run it yourself with `! <command>` if intentional." },

    # Python requests library
    { pattern = "requests\\.(delete|put|patch)\\(", reason = "Python requests destructive HTTP call — modifies or deletes a remote resource. Run it yourself with `! <command>` if intentional." },

    # Python httpx library
    { pattern = "httpx\\.(delete|put|patch)\\(", reason = "Python httpx destructive HTTP call — modifies or deletes a remote resource. Run it yourself with `! <command>` if intentional." },

    # ── POST — requires explicit user approval ─────────────────────────────
    # curl: short flag (-X) and long flag (--request)
    { pattern = "curl.*-X\\s+POST", reason = "POST to external API requires explicit approval. Run it yourself with `! <command>` if intentional." },
    { pattern = "curl.*--request\\s+POST", reason = "POST to external API requires explicit approval. Run it yourself with `! <command>` if intentional." },

    # wget
    { pattern = "wget.*--method[=\\s]POST", reason = "POST via wget requires explicit approval. Run it yourself with `! <command>` if intentional." },

    # httpie CLI
    { pattern = "\\bhttp\\s+POST\\s", reason = "httpie POST requires explicit approval. Run it yourself with `! <command>` if intentional." },

    # Python requests library
    { pattern = "requests\\.post\\(", reason = "Python requests POST requires explicit approval. Run it yourself with `! <command>` if intentional." },

    # Python httpx library
    { pattern = "httpx\\.post\\(", reason = "Python httpx POST requires explicit approval. Run it yourself with `! <command>` if intentional." },
]
